<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Nakiah's Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="form-card" style="max-width:380px;width:100%;">
    <a href="/index.html" class="brand" style="display:block;text-align:center;margin-bottom:22px;">Nakiah's <span>Closet</span></a>
    <h3 style="text-align:center;margin-bottom:6px;">Admin login</h3>
    <p style="text-align:center;color:#5a4636;margin-bottom:22px;">Manage stock and prices for the shop.</p>
    <form id="loginForm">
      <div class="form-row">
        <label for="password">Admin password</label>
        <input id="password" name="password" type="password" required autofocus>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;">Log in</button>
    </form>
  </div>
</main>
<script>
  const form = document.getElementById("loginForm");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Checking...";
    let notice = form.querySelector(".notice");
    if (notice) notice.remove();

    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("password").value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Login failed");
      window.location.href = "/admin/dashboard.html";
    } catch (err) {
      const div = document.createElement("div");
      div.className = "notice error";
      div.textContent = err.message;
      form.prepend(div);
      btn.disabled = false;
      btn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
